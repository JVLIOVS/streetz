name: Build, test & deploy to GitHub Pages

# Publishes dist/ to the gh-pages branch (Pages "deploy from branch"),
# which needs no manual Pages setting in the repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # shipped dependencies only (three, rapier, trystero): fail on known high/critical flaws
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Push dist/ to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
